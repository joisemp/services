###############################################################################
# CI workflow — runs on every PR targeting main and on direct pushes to main.
# Spins up Postgres as a service container, installs requirements, and runs
# Django's test suite from src/.
#
# To enforce this as a merge gate:
#   GitHub → Settings → Branches → Add rule for `main`
#     ✓ Require status checks to pass before merging
#       → select: "Run tests"
###############################################################################
name: CI — Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: services
          POSTGRES_PASSWORD: services
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U services"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-not-for-production
      ENVIRONMENT: development
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: services_test
      POSTGRES_USER: services
      POSTGRES_PASSWORD: services
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DEFAULT_FROM_EMAIL: noreply@localhost
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        working-directory: .
        run: pip install -r requirements/development.txt

      - name: Run tests
        run: python manage.py test -v 2
