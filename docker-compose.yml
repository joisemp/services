###############################################################################
# Development stack
# Usage: docker compose up --build
###############################################################################
name: services

services:

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    ports:
      - "7000:8000"
    volumes:
      - ./src:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-services}
      POSTGRES_USER: ${POSTGRES_USER:-services}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-services}
    volumes:
      - services_postgres_data:/var/lib/postgresql/data
    # Avoid clashing with other local Postgres instances on host :5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-services}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Mailpit (dev email inbox) ───────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI → http://localhost:8025
      - "1025:1025"   # SMTP → Django sends here
    restart: unless-stopped

volumes:
  services_postgres_data:
