{% if gallery_images %}
  <div id="product-detail-gallery-{{ product.id }}" class="carousel slide inventory-detail-carousel" data-bs-ride="carousel" data-bs-interval="6000" data-bs-pause="hover">
    <div class="carousel-inner rounded-3 border">
      {% for image in gallery_images %}
        <div class="carousel-item {% if forloop.first %}active{% endif %}">
          <img src="{{ image.image.url }}" class="d-block w-100 inventory-detail-carousel-image" alt="{{ product.name }} image {{ forloop.counter }}">
        </div>
      {% endfor %}
    </div>
    {% if gallery_images|length > 1 %}
      <button class="carousel-control-prev" type="button" data-bs-target="#product-detail-gallery-{{ product.id }}" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#product-detail-gallery-{{ product.id }}" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    {% endif %}
  </div>
{% else %}
  <div class="inventory-detail-image-placeholder rounded-3 border d-flex align-items-center justify-content-center">
    <span class="material-symbols-outlined text-muted">image</span>
  </div>
{% endif %}
