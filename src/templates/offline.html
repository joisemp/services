<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <meta name="robots" content="noindex">
    <title>Services — Offline</title>
    <style>
        :root {
            color-scheme: light;
            --brand: #2563EB;
            --ink: #0f172a;
            --muted: #64748b;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(160deg, #eff6ff 0%, var(--bg) 55%, #e2e8f0 100%);
            color: var(--ink);
        }
        .card {
            width: min(28rem, 100%);
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .mark {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.25rem;
            border-radius: 1rem;
            background: var(--brand);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.5;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 0.5rem;
            background: var(--brand);
            color: #fff;
            font: inherit;
            font-weight: 600;
            padding: 0.7rem 1.25rem;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">S</div>
        <h1>You're offline</h1>
        <p>Services needs a network connection for tickets, fleet, and inventory. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
